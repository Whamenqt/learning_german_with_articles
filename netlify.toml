[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# SPA fallback: the app is a client-side router (React Router).
# Netlify serves index.html for any path that isn't a static asset or a function,
# and App.tsx / the public ArticlePage does the real routing + Supabase lookup.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  publish = "dist"
  autoLaunch = false
